name: Release — Desktop Installers (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate flagship icons & run checks
        run: |
          npm run desktop:icon
          npm run check
          npm run desktop:compile

      - name: Package desktop installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.flag }} --publish never

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conceptus-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built OS artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          shopt -s nullglob
          FILES=(*.exe *.dmg *.AppImage)
          if [ ${#FILES[@]} -gt 0 ]; then
            sha256sum "${FILES[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          ASSETS=(artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/SHA256SUMS.txt)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --title "CONCEPTUS $TAG_NAME" \
              --generate-notes
          fi
